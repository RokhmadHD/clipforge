[package]
name = "clipforge"
version = "0.0.1"
description = "AI-assisted short-video editor (HTML/three.js scenes -> FFmpeg)"
edition = "2021"

[lib]
name = "clipforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
